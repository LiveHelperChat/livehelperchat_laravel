name: E2E

on:
  push:
    branches:
      - main
      - master
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      # Laravel application database.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

      # Live Helper Chat legacy database (same MySQL instance, read via getenv).
      LHC_DB_CONNECTION: mysql
      LHC_DB_HOST: 127.0.0.1
      LHC_DB_PORT: 3306
      LHC_DB_DATABASE: testing
      LHC_DB_USERNAME: root
      LHC_DB_PASSWORD: password

      # Legacy site secret and the demo-page bypass used by the widget specs.
      LHC_SECRET_HASH: e2e-secret-hash
      E2E_SECRET: e2e-demo-secret

      # Back-office operator provisioned by `php artisan lhc:admin admin admin`
      # and used by the e2e login specs.
      LHC_USERNAME: admin
      LHC_PASSWORD: admin

      # Playwright boots the app on this address (see e2e/playwright.config.ts).
      BASE_URL: http://127.0.0.1:8000
      APP_URL: http://127.0.0.1:8000
      PHP_CLI_SERVER_WORKERS: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, mysqli, gd, intl
          coverage: none

      - name: Clone LiveHelperChat repository
        run: |
          cd public
          git clone --depth 1 https://github.com/LiveHelperChat/livehelperchat.git

      - name: Create symlinks in public folder
        run: |
          cd public
          ln -s livehelperchat/lhc_web/cache cache
          ln -s livehelperchat/lhc_web/design design
          ln -s livehelperchat/lhc_web/extension extension
          ln -s livehelperchat/lhc_web/ezcomponents ezcomponents
          ln -s livehelperchat/lhc_web/lib lib
          ln -s livehelperchat/lhc_web/modules modules
          ln -s livehelperchat/lhc_web/pos pos
          ln -s livehelperchat/lhc_web/settings settings
          ln -s livehelperchat/lhc_web/translations translations
          ln -s livehelperchat/lhc_web/var var

      - name: Configure legacy settings
        run: |
          cd public/settings
          cp settings.ini.default.php settings.ini.php
          php -r '
            $file = "settings.ini.php";
            $settings = require $file;
            $settings["settings"]["site"]["installed"] = true;
            $settings["settings"]["site"]["secrethash"] = getenv("LHC_SECRET_HASH") ?: "e2e-secret-hash";
            file_put_contents($file, "<?php\nreturn " . var_export($settings, true) . ";\n");
          '

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Clear cached configuration
        run: php artisan config:clear

      - name: Import SQL database
        run: mysql -h 127.0.0.1 -u root -ppassword testing < database/schema.sql

      - name: Run migrations
        run: php artisan migrate --force

      - name: Update database from production
        run: |
          cd public
          php cron.php -s site_admin -c cron/util/update_database

      - name: Provision the admin operator (admin/admin)
        run: php artisan lhc:admin admin admin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
